name: Fetch Vic members

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt — skipping pip install (stdlib only)"
          fi

      - name: Fetch Vic members (Wikidata raw)
        run: python scripts/fetch_vic_members.py

      - name: Fetch Vic members (Parliament of Victoria official)
        id: official
        continue-on-error: true
        run: python scripts/fetch_vic_official.py

      - name: Commit and push data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vic_raw.json data/vic_official.json
          if git diff --staged --quiet; then
            echo "No changes to data/vic_raw.json or data/vic_official.json"
          else
            git commit -m "chore: update Vic member data"
            git push origin HEAD:main
          fi

      - name: Fail if official fetch reported bad chamber counts
        if: steps.official.outcome == 'failure'
        run: |
          echo "scripts/fetch_vic_official.py failed (likely chamber count mismatch)."
          exit 1
