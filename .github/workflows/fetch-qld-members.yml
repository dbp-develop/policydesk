name: Fetch QLD members

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pdftotext (MEMLIST cross-check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Fetch QLD members (Parliament Member List)
        run: python scripts/fetch_qld_official.py

      - name: Build data/qld/members.json
        run: python scripts/build_qld_members.py

      - name: Validate members
        run: python scripts/validate_members.py

      - name: Commit and push data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/qld_official.json data/qld/members.json data/qld/vacancies.json
          if git diff --staged --quiet; then
            echo "No changes to QLD member data files"
          else
            git commit -m "chore: update QLD member data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
