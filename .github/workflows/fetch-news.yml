name: Fetch news

# Daily: build data/news from The Conversation's feeds (headline, source, date, link only),
# validate, and commit to main if anything changed.
on:
  schedule:
    - cron: "23 19 * * *"   # 19:23 UTC = early morning in Melbourne
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build news
        run: python scripts/build_news.py

      - name: Validate news
        run: python scripts/validate_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news
          # index.json's timestamp changes every run; only commit when items changed
          if git diff --staged --quiet -- data/news ':!data/news/index.json'; then
            echo "No news changes"
          else
            git commit -m "chore: update news"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
