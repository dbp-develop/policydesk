name: Fetch news

# Daily: build data/news from The Conversation's feeds (headline, source, date, link only),
# validate, and open a pull request if any item changed. Does not push to main.
on:
  schedule:
    - cron: "23 19 * * *"   # 19:23 UTC = early morning in Melbourne
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build news
        run: python scripts/build_news.py

      - name: Validate news
        run: python scripts/validate_news.py

      - name: Upload news files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: news-data
          if-no-files-found: error
          path: data/news

  open-pr:
    needs: fetch
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: news-data
          path: incoming

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/open_data_pr.sh \
            bot/news \
            "chore: update news" \
            incoming \
            data/news
