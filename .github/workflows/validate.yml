name: Validate data

# Runs the four data validators on pull requests and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate members
        run: python scripts/validate_members.py

      - name: Validate boundaries
        run: python scripts/validate_boundaries.py

      - name: Validate news
        run: python scripts/validate_news.py

      - name: Validate photos and socials
        run: python scripts/validate_photos_socials.py
